# 前端静态资源 + API 反向代理（Docker Compose 中 frontend 容器使用）
upstream library_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端为 SPA：任何未知路径都回落到 index.html，交给 React Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口统一转发到后端，保持 /api 前缀不变
    location /api/ {
        proxy_pass http://library_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 健康检查直接用后端 actuator，便于容器编排探活
    location = /healthz {
        access_log off;
        proxy_pass http://library_backend/actuator/health;
    }

    # 静态资源缓存；index.html 不缓存，保证发布后立即生效
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;
}
