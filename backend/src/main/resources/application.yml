server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: library-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USERNAME:library}
    password: ${DB_PASSWORD:library123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  web:
    locale: zh_CN
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 保持默认的枚举/空值处理，避免与 MP 自动映射冲突
  global-config:
    banner: false
    db-config:
      id-type: auto
      insert-strategy: not_null
      update-strategy: not_null

library:
  jwt:
    # 生产必须通过环境变量 JWT_SECRET 覆盖，长度至少 32 字节
    secret: ${JWT_SECRET:dev-only-library-jwt-secret-key-please-change-me}
    access-token-ttl: 30m
    refresh-token-ttl: 7d
  cors:
    # 逗号分隔，供前端开发服务器跨域访问
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  borrow:
    loan-days: 30
    max-renew-times: 2
    renew-days: 15
    max-borrow-per-reader: 5
    fine-per-day: 0.50
    allow-renew-when-overdue: false
    max-fine-amount: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.library: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
